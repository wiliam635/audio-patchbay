name: Build patchbay installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build DMG
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          VITE_DISABLE_UPDATER: 'true'
        run: bun run tauri build --target aarch64-apple-darwin --bundles dmg --no-sign --config src-tauri/tauri.patchbay-build.conf.json
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build NSIS installer
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          VITE_DISABLE_UPDATER: 'true'
        run: bun run tauri build --bundles nsis --no-sign --config src-tauri/tauri.patchbay-build.conf.json
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
